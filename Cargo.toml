[package]
name = "tc-ir"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
destream = { path = "../deps/destream", version = "0.10" }
hr-id = { path = "../deps/hr-id", version = "0.7", features = ["stream"] }
safecast = "0.2"
serde = { version = "1", features = ["derive"] }
umask = "2.1"
pathlink = { path = "../deps/pathlink", features = ["stream"] }
tc-error = { path = "../tc-error" }
tc-value = { path = "../tc-value" }
number-general = { path = "../deps/number-general", version = "0.14", default-features = false, features = ["stream"] }

[dev-dependencies]
destream_json = { path = "../deps/destream_json", version = "0.15", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
